<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="330" viewBox="0 0 1200 330"
     role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">wtf-is-this-project</title>
  <desc id="heroDesc">On the left, the skill name and a one-line value statement. On the right, two cards: a raw project made of dense grey text lines, an arrow, and a structured project brief made of six clean labeled rows.</desc>

  <rect width="1200" height="330" rx="26" fill="#ffffff" stroke="#e4e7eb" stroke-width="1.5"/>

  <!-- ================= LEFT: identity ================= -->
  <g id="identity" transform="translate(56 52)">
    <text x="0" y="0"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" fill="#6b7280" letter-spacing="1.8">AGENT SKILLS · 中文 / ENGLISH</text>

    <text x="0" y="64"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="46" font-weight="700" fill="#1f2328">wtf-is-this-project</text>

    <text x="0" y="122"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
          font-size="21" fill="#1f2328">把一个陌生的项目，变成没写过代码的人</text>
    <text x="0" y="154"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
          font-size="21" fill="#1f2328">也能一口气读完的项目速览。</text>

    <text x="0" y="200"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
          font-size="18" fill="#6b7280">文风归纳自 25 篇文章 · 句法由本地化清单逐条清洗</text>
    <text x="0" y="226"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
          font-size="18" fill="#6b7280">产出直接进对话，不创建任何文件。</text>
  </g>

  <!-- ================= RIGHT: before / after ================= -->
  <g id="transformation" transform="translate(660 52)">

    <!-- before -->
    <text x="0" y="18"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" fill="#6b7280">raw project</text>
    <rect x="0" y="30" width="200" height="180" rx="10"
          fill="#fbfcfd" stroke="#e4e7eb" stroke-width="1.5"/>
    <g fill="#d8dee4">
      <rect x="16" y="54"  width="164" height="7" rx="3.5"/>
      <rect x="16" y="72"  width="128" height="7" rx="3.5"/>
      <rect x="16" y="90"  width="152" height="7" rx="3.5"/>
      <rect x="16" y="108" width="96"  height="7" rx="3.5"/>
      <rect x="16" y="126" width="168" height="7" rx="3.5"/>
      <rect x="16" y="144" width="140" height="7" rx="3.5"/>
      <rect x="16" y="162" width="116" height="7" rx="3.5"/>
      <rect x="16" y="180" width="148" height="7" rx="3.5"/>
    </g>

    <!-- arrow -->
    <line x1="216" y1="120" x2="256" y2="120" stroke="#6b7280" stroke-width="2.5"/>
    <polygon points="256,113 269,120 256,127" fill="#6b7280"/>

    <!-- after -->
    <text x="280" y="18"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" fill="#2563eb">project brief</text>
    <rect x="280" y="30" width="204" height="180" rx="10"
          fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <g>
      <circle cx="304" cy="56"  r="5" fill="#2563eb"/>
      <rect x="318" y="51"  width="150" height="9" rx="4.5" fill="#c9d1d9"/>
      <circle cx="304" cy="86"  r="5" fill="#2563eb"/>
      <rect x="318" y="81"  width="118" height="9" rx="4.5" fill="#c9d1d9"/>
      <circle cx="304" cy="116" r="5" fill="#2563eb"/>
      <rect x="318" y="111" width="142" height="9" rx="4.5" fill="#c9d1d9"/>
      <circle cx="304" cy="146" r="5" fill="#2563eb"/>
      <rect x="318" y="141" width="126" height="9" rx="4.5" fill="#c9d1d9"/>
      <circle cx="304" cy="176" r="5" fill="#2563eb"/>
      <rect x="318" y="171" width="134" height="9" rx="4.5" fill="#c9d1d9"/>
      <circle cx="304" cy="196" r="5" fill="#2563eb"/>
      <rect x="318" y="191" width="108" height="9" rx="4.5" fill="#c9d1d9"/>
    </g>
  </g>
</svg>
